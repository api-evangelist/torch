aid: torch
name: Torch
description: 'Torch (Redfish Labs, Inc. dba Torch Leadership Labs) is a leadership
  development and executive coaching platform that pairs expert human coaches with
  AI to help mid-market and enterprise organizations grow leaders and navigate change.
  Its offerings include Change Coaching (leaders-turned-coaches trained in Torch''s
  change approach), the Spark AI coaching agent (always-on AI guidance for practicing
  conversations and turning insight into progress), and Organizational Intelligence
  (real-time visibility into change patterns and people dynamics). Torch focuses on
  AI transformation, organizational restructuring, organizational resilience, and
  leadership growth, and counts Airbnb, Reddit, Tripadvisor, FICO, and Twitch among
  its customers. Torch is a SaaS product with SSO (SAML), Zoom, and Slack integrations
  but publishes no public developer API; this profile captures its public identity
  and security posture.'
